.badge,.info{background:var(--accent-soft);color:var(--text-primary);border-color:var(--border-color)}

.badge.red,.error,.cash-shortfall{background:var(--danger-soft);color:var(--status-danger);border-color:var(--status-danger)}
.badge.gray{background:var(--bg-surface-alt);color:var(--text-secondary)}

.chart text{fill:var(--text-secondary);font-size:12px}.chart circle:hover{stroke:var(--bg-surface)}
.receipt-source,.pills,.answer .numbers,.chat.user,.topbar .pill{background:var(--bg-surface-alt);color:var(--text-primary)}

.guide-card h1,.guide-link,.guide-help-button{color:var(--accent-color)}.guide-card .guide-kicker,.guide-chapter-label,.guide-chapters span,.guide-close{color:var(--text-secondary)}
.guide-chapters button:hover,.guide-help-button{background:var(--accent-soft);border-color:var(--border-strong)}
.guide-chapter-label select{background:var(--bg-surface);color:var(--text-primary)}
.finora-guide[data-mode="tour"] .guide-actions{background:var(--bg-surface)}
.guide-spot{border-color:var(--brand-orange)}
.text-pdf-icon{width:22px;height:22px;vertical-align:middle;flex-shrink:0}
.setup-step{display:inline-block;padding:4px 8px;background:var(--accent-soft);color:var(--accent-color);border-radius:7px;font-size:12px;margin-right:6px}
.appearance-card .field{margin:12px 0}.spending-estimate{display:block;font-size:22px;line-height:1.3;margin:12px 0;color:var(--text-primary)}
.cash-gauge{margin:18px 0}.gauge-label{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin:12px 0 6px}.gauge-label strong{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.gauge-track i{display:block;position:absolute;inset:0 auto 0 0}.gauge-current{background:var(--chart-secondary)}.gauge-projected{background:var(--chart-primary)}
.gauge-track .gauge-buffer{background:repeating-linear-gradient(135deg,transparent 0,transparent 4px,var(--buffer-line) 4px,var(--buffer-line) 6px);border-right:2px solid var(--buffer-line)}
.gauge-legend{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;font-size:12px;color:var(--text-secondary);margin-top:8px}

.cash-shortfall{padding:10px;border-radius:8px;font-size:14px}.cash-story{margin:12px 0}.safe-planning .cardhead{align-items:flex-start}.safe-planning .cardhead h2{font-size:18px}

:focus-visible{outline:3px solid var(--focus-color);outline-offset:3px}

.kpi.dark,.toast{background:var(--hero-start);color:var(--hero-text);border-color:var(--hero-start)}.kpi.dark .label,.kpi.dark .foot,.kpi.dark .delta{color:var(--hero-muted)}
.homequick .quickicon{background:var(--accent-soft);color:var(--accent-color)}

.sidebar{background:var(--hero-start);color:var(--hero-muted)}.sidebar .navlabel,.sidebar .nav button,.sidebar .sidecard,.sidebar .profile{color:var(--hero-muted)}.sidebar .nav button.active,.sidebar .nav button:hover{background:var(--hero-end);color:var(--hero-text)}
.dot{background:var(--chart-primary)}.dot.navy{background:var(--chart-secondary)}

.sidebar .nav .count,.sidebar .brand span,.sidebar .sidecard svg{color:var(--hero-muted)}button:disabled{cursor:not-allowed}

.ai-activation{padding:12px;margin-bottom:12px;border:1px solid var(--border-color);border-radius:10px;background:var(--bg-surface)}.ai-activation p{margin-bottom:8px}.ai-activation .btn{margin:3px 4px 3px 0}

/* Reference design: editorial headings, warm surfaces and consistent outline icon rows. */
h1,h2,h3,.tool-copy strong,.more-subtitle strong{font-family:var(--font-ui);font-weight:600}
h1{font-size:32px;line-height:1.15;letter-spacing:-.55px}h2{font-size:22px;line-height:1.25}h3{font-size:18px;line-height:1.3}
body{line-height:1.55}.card,.collectioncard,.optioncard{border-radius:12px}.headrow{margin-bottom:24px}.sectionline{align-items:center;gap:12px}
.finora-wordmark{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--accent-color);font-size:11px;letter-spacing:4px;font-weight:500}
.workspace-symbol{display:inline-flex;align-items:center;justify-content:center;width:35px;height:38px;color:var(--accent-color);flex-shrink:0}.workspace-symbol svg{width:100%;height:100%;overflow:visible}
.tool-row{width:100%;display:flex;align-items:center;gap:18px;min-height:86px;padding:18px 0;border:0;border-bottom:1px solid var(--border-color);border-radius:0;background:transparent;color:var(--text-primary);text-align:left;box-shadow:none}
.tool-row:hover{background:var(--bg-surface-alt)}.tool-copy{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}.tool-copy strong{font-size:20px;line-height:1.25;overflow-wrap:anywhere}.tool-copy small,.tool-copy>span{font-size:14px;line-height:1.4;color:var(--text-secondary)}.tool-copy small b{color:var(--accent-color);font-weight:500}
.tool-chevron{width:20px;height:24px;flex-shrink:0;color:var(--text-primary)}.tool-count{font-size:14px;color:var(--text-secondary)}
.more-backdrop,.flow-backdrop{display:flex;padding:0;align-items:stretch;justify-content:center;background:var(--overlay-color)}
.modal.more-dialog,.modal.flow-modal{display:flex;flex-direction:column;width:var(--app-frame-width);max-width:100%;flex:0 0 auto;height:100dvh;max-height:100dvh;margin:0;padding:0;border:0;border-radius:0;background:var(--bg-primary);overflow:hidden}
.more-header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px 4px;flex-shrink:0;min-height:60px}.more-header .iconbtn{width:44px;height:44px;background:transparent;border:0;color:var(--text-secondary)}.more-header .iconbtn svg{width:23px;height:23px}
.more-scroll,.flow-scroll{padding:0 24px 28px;overflow:auto;overscroll-behavior:contain;flex:1;min-height:0}.more-scroll h1,.flow-scroll h1{font-size:clamp(29px,7.8vw,38px);line-height:1.12;margin:8px 0 10px;overflow-wrap:anywhere}
.more-subtitle{font-size:16px!important;color:var(--text-secondary);line-height:1.45;margin:8px 0 20px}.more-tool-total{font-size:14px;color:var(--text-secondary);margin:20px 0 4px}.more-back{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:var(--text-secondary);min-height:40px;margin-bottom:12px}
.workflow-search{display:flex;align-items:center;gap:12px;position:relative;background:var(--bg-surface-alt);border:1px solid var(--border-color);border-radius:10px;margin:20px 0 24px;padding:0 14px}.workflow-search>svg{width:21px;height:21px;flex-shrink:0;color:var(--text-secondary)}.workflow-search input{min-width:0;width:100%;padding:12px 0;border:0;border-radius:0;background:transparent;font-size:16px;color:var(--text-primary);min-height:48px}.workflow-search:focus-within{outline:2px solid var(--focus-color);outline-offset:2px}.workflow-search input:focus{outline:0}
.more-quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin:18px 0 30px}.more-quick button{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:9px;padding:0;border:0;background:none;color:var(--text-primary);font-size:14px;text-align:center;min-height:110px}.more-quick .workspace-symbol{background:var(--accent-soft);border-radius:50%;width:60px;height:60px;padding:15px}.more-quick button>span:last-child{max-width:100px;line-height:1.35}
.more-dialog .bottomnav,.flow-modal .bottomnav{position:relative;bottom:auto;left:auto;transform:none;width:100%;max-width:none;flex-shrink:0;z-index:auto;margin:0;border-radius:0;padding:5px 8px max(7px,env(safe-area-inset-bottom));background:var(--bg-primary);border-top:1px solid var(--border-color)}
.bottomnav{background:var(--bg-primary)}.bottomnav button.active{border-radius:9px;color:var(--accent-color);background:var(--accent-soft)}.bottomnav button svg{width:24px;height:24px}.bottomnav button{gap:4px}.bottomnav button span{line-height:1.2}
.workflow-head{margin:8px 0 24px}.workflow-brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.workflow-brand .btn{background:none;border:0;color:var(--text-secondary);font-weight:400;padding:0}.workflow-head h1{margin-bottom:10px}.workflow-step{font:18px/1.45 var(--font-ui);color:var(--text-primary);margin:10px 0 14px}.workflow-actions{display:grid;gap:10px;margin:24px 0}.workflow-actions .btn{width:100%;min-height:48px;border-radius:8px;font-size:14px;padding:12px 16px}.workflow-actions .btn:not(.primary){border-color:var(--border-strong);background:transparent;color:var(--accent-color)}
.pdf-upload{padding:20px}.pdf-upload>h2{margin-bottom:12px}.pdf-picker{position:relative;margin:22px 0}.pdf-dropzone{min-height:210px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;border:1px dashed var(--border-strong);border-radius:10px;padding:24px 12px;text-align:center;background:transparent;cursor:pointer}.pdf-dropzone .workspace-symbol{width:42px;height:52px}.pdf-dropzone strong{font:22px/1.3 var(--font-ui)}.pdf-dropzone>span:last-child{font-size:14px;color:var(--text-secondary)}.pdf-picker input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;margin:0;padding:0}.pdf-picker:focus-within{outline:3px solid var(--focus-color);outline-offset:3px;border-radius:10px}
.file-summary{display:flex;align-items:center;gap:12px;min-width:0}.file-summary strong{font-size:14px;overflow-wrap:anywhere}.file-summary .workspace-symbol{width:27px;height:34px}.file-summary p{font-size:12px}
.pdf-upload.compact{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:14px;margin-bottom:20px}.pdf-upload.compact>h2,.pdf-upload.compact>p,.pdf-upload.compact>details,.pdf-upload.compact>.quickactions{display:none}.pdf-upload.compact .file-summary{flex:1}.pdf-upload.compact .pdf-picker{margin:0;max-width:140px}.pdf-upload.compact .pdf-dropzone{min-height:44px;border:0;padding:6px;gap:0}.pdf-upload.compact .pdf-dropzone .workspace-symbol,.pdf-upload.compact .pdf-dropzone>span:last-child{display:none}.pdf-upload.compact .pdf-dropzone strong{font:14px/1.4 inherit;color:var(--accent-color);text-decoration:underline}
.receipt-review{padding:0;border:0;background:transparent}.receipt-review h2{font-size:20px}.receipt-review .receipt-fields{grid-template-columns:1fr;gap:16px}.receipt-fields input,.receipt-fields select{min-height:46px;background:var(--bg-surface);border-color:var(--border-strong)}.receipt-review button[type=submit]{width:100%;min-height:48px}.receipt-paid{padding:16px 0;border-top:1px solid var(--border-color)}
.receipt-success{text-align:center;padding:28px 4px}.success-seal{display:grid;place-items:center;width:86px;height:86px;border-radius:50%;background:var(--positive-soft);border:1px solid var(--border-color);color:var(--status-positive);margin:6px auto 30px}.success-seal svg{width:43px;height:43px}.receipt-success h2{font-size:25px;margin-bottom:12px}.receipt-success>p{color:var(--text-secondary);margin:10px 0}
.collectioncard.collection-list-item{padding:0;margin:0;border:0;background:transparent;border-radius:0}.collection-identity{display:flex;align-items:center;gap:18px;margin:28px 0}.collection-identity .workspace-symbol{height:46px;width:37px}.collection-identity h2{font-size:25px;margin-bottom:4px}.collection-identity p{color:var(--text-secondary)}
.collection-facts{border-top:1px solid var(--border-color);border-bottom:1px solid var(--border-color);padding:12px 0;margin:24px 0}.collection-facts>div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;font-size:14px}.collection-facts dt{color:var(--text-secondary)}.collection-facts dd{margin:0;text-align:right}.flow-scroll .field{margin:18px 0 7px}.flow-scroll textarea{width:100%;font-size:16px;padding:14px;line-height:1.65;resize:vertical;min-height:180px}.flow-scroll footer{display:flex;flex-direction:column;gap:8px;padding:8px 0 12px;border:0}.flow-scroll footer .btn:not(.primary){border:0;background:none;color:var(--accent-color);text-decoration:underline}
.saved-drafts{margin-top:28px;border-top:1px solid var(--border-color);padding:18px 0}.saved-drafts summary{min-height:44px;color:var(--text-secondary);font-size:14px;cursor:pointer}.saved-drafts>p{margin:12px 0}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.homeassistant button,.brand{color:var(--hero-text)}.appgreeting h1{font-size:31px}.safe-planning .cardhead h2{font-size:22px}.btn.primary{font-weight:600}
@media(max-width:360px){.more-header{padding-left:18px;padding-right:18px}.more-scroll,.flow-scroll{padding-left:18px;padding-right:18px}.tool-row{gap:13px}.tool-copy strong{font-size:18px}.tool-copy small,.tool-copy>span{font-size:14px}.more-quick{gap:8px}.more-quick .workspace-symbol{height:54px;width:54px}.pdf-upload{padding:15px}.collection-facts>div{flex-wrap:wrap}}
