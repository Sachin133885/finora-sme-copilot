function cashPage(){const base=forecast(data,{days:scenario.days}),f=forecast(data,scenario);return `${pageHead('cash',t('Test a decision before you commit.','做出承诺前，先评估决策。'))}<div class="kpis" id="scenario-kpis">${kpi('cashBalance',summary(data).cash,t('Reconciled ledger','已核对账本'),'cash',true)}${kpi('minimum',f.min.cash,date(f.min.date),'cash')}${kpi('shortfall',f.shortfall,t('Below zero, before reserve','低于零的部分，不含储备'),'financing')}${kpi('need',f.need,t('Includes minimum reserve','包含最低储备'),'financing')}</div><section class="card"><div class="cardhead"><div><h2>${t('Cash-flow scenario studio','现金流情景工作区')}</h2><p>${t('Change an assumption. See the consequence.','更改假设，查看影响。')}</p></div><div class="pills">${[['base',t('Base','基准')],['best',t('Best case','乐观')],['stress',t('Stress','压力')]].map(([id,n])=>`<button data-action="preset" data-preset="${id}">${n}</button>`).join('')}</div></div><div class="controls">${slider('growth',t('New sales growth / decline','新增销售增长 / 下降'),-40,40,'%')}${slider('delay',t('Customer-payment delay','客户付款延迟'),0,30,t(' days','天'))}${slider('expense',t('Operating-cost increase','运营成本增加'),0,40,'%')}${slider('supplierDelay',t('Supplier deferral (requires agreement)','供应商延期（需同意）'),0,30,t(' days','天'))}<div class="field"><label for="hiring">${t('Additional monthly payroll (CNY)','每月新增薪酬（人民币）')}</label><input type="number" id="hiring" min="0" max="1000000" step="100" value="${scenario.hiring/100}"></div><div class="field"><label for="oneOff">${t('One-time cost, tomorrow (CNY)','明日一次性支出（人民币）')}</label><input type="number" id="oneOff" min="0" max="1000000" step="100" value="${scenario.oneOff/100}"></div></div><div class="info">${t('Supplier deferral is a simulation, not an instruction or executed change. Sales adjustments affect new retail sales only; existing invoice amounts stay fixed.','供应商延期是模拟，不代表指令或已执行变更。销售调整仅影响新增零售收入；现有发票金额保持不变。')}</div><div class="legend"><span><i class="dot"></i>${t('Your scenario','您的情景')}</span><span><i class="dot navy"></i>${t('Base forecast','基准预测')}</span><select id="horizon" aria-label="${t('Forecast horizon','预测期间')}">${[30,60,90].map(n=>`<option value="${n}" ${scenario.days===n?'selected':''}>${n}${t(' days','天')}</option>`).join('')}</select></div><div id="scenario-chart">${chart([{name:t('Scenario','情景'),points:f.points,color:'#138c7c'},{name:t('Base','基准'),points:base.points,color:'#8294aa'}],235)}</div><div class="compare" id="scenario-impact"><strong>${t('Impact on the lowest balance:','最低余额变化：')} ${money(f.min.cash-base.min.cash)}</strong><p class="small muted">${f.first?t(`First cash deficit: ${date(f.first.date)}.`,`首次现金赤字：${date(f.first.date)}。`):t('No negative daily balance in this scenario.','该情景没有出现负的日末余额。')} ${t(`Reserve target: ${money(f.reserve)}.`,`储备目标：${money(f.reserve)}。`)}</p></div></section><div class="two"><section class="card"><h2>${t('What goes into this forecast','预测依据')}</h2><ul class="list"><li>${t(`Opening cash ${money(base.points[0].cash)} = opening ledger + posted receipts − posted payments.`,`起始现金${money(base.points[0].cash)} = 期初账本 + 已记录收入 − 已记录支出。`)}</li><li>${t(`Daily new sales: ${money(base.dailySales)}; daily operating costs: ${money(base.dailyOps)}. Average of the last 30 days.`,`每日新增销售：${money(base.dailySales)}；每日运营成本：${money(base.dailyOps)}。采用过去30天平均值。`)}</li><li>${t('Receivables use entered expected dates; bills use due dates. Payroll and rent recur monthly.','应收款使用录入的预计日期；账单使用到期日。工资与租金按月重复。')}</li><li>${t('No probability band, seasonality model, tax forecast or lender approval. Hiring costs begin on day 30.','不包含概率区间、季节模型、税务预测或贷款批准。新增薪酬从第30天开始。')}</li></ul></section><section class="card"><h2>${t('Scheduled cash movements','已安排现金流动')}</h2>${f.events.slice(0,8).map(e=>`<div class="timeline"><span>${date(e.date)}</span><button class="textbtn" data-action="evidence" data-id="${esc(e.id)}">${esc(e.id)}</button><strong style="color:${e.kind==='receivable'?'var(--jade)':'var(--ink)'}">${e.kind==='receivable'?'+':'−'}${money(e.amount)}</strong></div>`).join('')}</section></div>`;}
function slider(id,title,min,max,suffix){return `<div class="field"><label for="${id}">${title}<output id="out-${id}">${scenario[id]}${suffix}</output></label><input id="${id}" type="range" min="${min}" max="${max}" value="${scenario[id]}" data-scenario="${id}"></div>`;}
function pageHead(key,sub,buttons=''){return `<div class="headrow"><div><div class="eyebrow muted">${t('Finora workspace','融财工作区')}</div><h1 style="margin-top:6px">${label(key)}</h1><p class="subtitle">${sub}</p></div>${buttons}</div>`;}
function invoicesPage(){const s=summary(data),items=data.invoices.filter(i=>i.kind===kindFilter&&(!filter||`${i.id} ${i.party} ${i.partyZh||''}`.toLowerCase().includes(filter.toLowerCase()))&&(statusFilter==='all'||status(i)===statusFilter));return `${pageHead('invoices',t('Keep collections and obligations in view.','清晰掌握回款与付款义务。'),btn(icon('plus')+t('New invoice','新建发票'),'newinvoice','primary'))}<div class="three"><section class="card"><span class="muted small">${label('ar')}</span><div class="metric">${money(s.ar)}</div>${badge(t('Outstanding customer invoices','客户未结发票'))}</section><section class="card"><span class="muted small">${label('overdue')}</span><div class="metric" style="color:var(--amber)">${money(s.overdue)}</div>${badge(t('Follow-up recommended','建议跟进'),'amber')}</section><section class="card"><span class="muted small">${label('ap')}</span><div class="metric">${money(s.ap)}</div>${badge(t('Supplier obligations','供应商付款义务'),'gray')}</section></div><section class="card"><div class="cardhead"><div class="pills"><button class="${kindFilter==='receivable'?'active':''}" data-action="kind" data-kind="receivable">${t('Money owed to you','别人欠你的钱')}</button><button class="${kindFilter==='payable'?'active':''}" data-action="kind" data-kind="payable">${t('Money you owe','你需要支付的钱')}</button></div>${btn(icon('down')+t('Export CSV','导出CSV'),'exportinvoices')}</div><div class="filters"><input id="searchInvoices" placeholder="${t('Search invoice or customer…','搜索发票或客户…')}" value="${esc(filter)}" aria-label="${t('Search invoices','搜索发票')}"><select id="statusFilter">${['all','pending','partial','overdue','paid'].map(k=>`<option value="${k}" ${statusFilter===k?'selected':''}>${t({all:'All statuses',pending:'Pending',partial:'Part paid',overdue:'Overdue',paid:'Recorded paid'}[k],{all:'所有状态',pending:'待结清',partial:'部分结清',overdue:'逾期',paid:'已记录结清'}[k])}</option>`).join('')}</select></div>${invoiceTable(items)}</section><section class="card"><h2>${t('Upcoming obligations','近期付款义务')}</h2>${data.invoices.filter(i=>i.kind==='payable'&&outstanding(i)).sort((a,b)=>a.due.localeCompare(b.due)).map(i=>`<div class="timeline"><span>${date(i.due)}</span><span>${esc(party(i))}<br><small>${esc(i.id)}</small></span><strong>${money(outstanding(i))}</strong></div>`).join('')}</section>`;}
function categories(){const tx=stats().transactions.filter(t=>t.type==='expense');return [...new Set(tx.map(t=>t.category))].map(category=>({category,amount:sum(tx.filter(t=>t.category===category))})).sort((a,b)=>b.amount-a.amount);}
const catLabel=c=>t({sales:'Sales receipts',operations:'Operations',payroll:'Payroll',rent:'Rent',marketing:'Marketing',inventory:'Inventory',settlement:'Invoice settlement',other:'Other'}[c]||c,{sales:'销售回款',operations:'运营成本',payroll:'薪酬',rent:'租金',marketing:'营销',inventory:'库存',settlement:'发票结算',other:'其他'}[c]||c);
function expensesPage(){const s=stats(),p=compare(),cats=categories(),tx=s.transactions.filter(x=>x.type==='expense'&&(expenseCategory==='all'||x.category===expenseCategory)&&(!filter||`${x.id} ${x.party} ${x.description}`.toLowerCase().includes(filter.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date)),dup=duplicates(data.transactions.filter(t=>t.type==='expense'));return `${pageHead('expenses',t('Know what changed. Investigate what matters.','了解变化，核查关键支出。'))}<div class="filters">${periodControl()}</div><div class="two"><section class="card"><div class="cardhead"><h2>${t('Spending by category','分类支出')}</h2><strong>${money(s.expenses)}</strong></div>${cats.map(c=>`<div class="barrow"><div class="barlabel"><button class="textbtn" data-action="category" data-category="${esc(c.category)}">${esc(catLabel(c.category))}</button><strong>${money(c.amount)}</strong></div><div class="bar"><i style="width:${c.amount/(s.expenses||1)*100}%"></i></div></div>`).join('')}</section><section class="card"><h2>${t('Period comparison','期间比较')}</h2><div class="metric">${money(s.expenses-p.expenses)}</div>${delta(s.expenses,p.expenses,true)}<div class="info">${t('Cash-basis expense comparison. Payroll and rent are recurring obligations; duplicate-looking records remain included until verified.','采用现金制比较。工资与租金为定期付款；疑似重复记录在核查前仍计入支出。')}</div><h3>${t('Review queue','核查清单')}</h3>${dup.map(g=>`<div class="actionrow"><div class="actionicon">${icon('risk')}</div><div><h3>${t('Possible duplicate','可能重复')} · ${money(g[0].amount)}</h3><p>${esc(g[0].party)} · ${date(g[0].date)}</p><div class="evidence">${g.map(x=>`<button data-action="evidence" data-id="${esc(x.id)}">${esc(x.id)}</button>`).join('')}</div></div></div>`).join('')||`<p class="small muted">${t('No same-date, same-vendor, same-amount matches.','没有同日同供应商同金额匹配。')}</p>`}</section></div><section class="card"><div class="filters"><input id="searchExpenses" value="${esc(filter)}" placeholder="${t('Search records or vendor…','搜索记录或供应商…')}" aria-label="${t('Search expenses','搜索支出')}"><select id="expenseCategory"><option value="all">${t('All categories','全部分类')}</option>${cats.map(c=>`<option value="${esc(c.category)}" ${expenseCategory===c.category?'selected':''}>${esc(catLabel(c.category))}</option>`).join('')}</select></div><div class="tablewrap"><table><thead><tr><th>${t('Date / record','日期 / 记录')}</th><th>${t('Vendor','供应商')}</th><th>${t('Category','分类')}</th><th class="money">${t('Amount','金额')}</th></tr></thead><tbody>${tx.slice(0,100).map(x=>`<tr><td>${date(x.date)}<br><button class="textbtn" data-action="evidence" data-id="${esc(x.id)}">${esc(x.id)}</button></td><td>${esc(x.party)}</td><td>${esc(catLabel(x.category))}</td><td class="money">${money(x.amount,2)}</td></tr>`).join('')}</tbody></table></div>${!tx.length?`<div class="empty">${t('No matching expenses.','没有匹配的支出。')}</div>`:''}<p class="small muted" style="margin-top:12px">${t(`Showing ${Math.min(100,tx.length)} of ${tx.length} records.`,`显示${Math.min(100,tx.length)}条，共${tx.length}条记录。`)}</p></section>`;}
function financingPage(){const f=forecast(data,scenario),l=financing(loanInput.principal,loanInput.apr,loanInput.months,loanInput.fee),withLoan=forecast(data,{...scenario,loan:l.net,repayment:l.schedule.map(x=>x.payment)});return `${pageHead('financing',t('Evaluate the trade-off, not just the headline rate.','评估真实取舍，而非只看名义利率。'))}<div class="banner">${icon('shield')}<div><strong>${t('Illustrative calculator · no lender offers','示例计算器 · 非贷款机构报价')}</strong><br><span class="muted">${t('User-entered assumptions. No approval, eligibility guarantee or bank partnership.','采用用户输入假设。不代表批准、资格保证或银行合作。')}</span></div></div><div class="two"><section class="card funding"><div class="eyebrow muted">${t('Money needed to run the business','经营周转资金需求')}</div><div class="metric">${money(f.need)}</div><p class="small muted">${t(`Lowest projected balance ${money(f.min.cash)} + reserve target ${money(f.reserve)}. Gap = max(0, reserve − lowest cash).`,`最低预计余额${money(f.min.cash)}，目标储备${money(f.reserve)}。缺口 = max(0, 储备 − 最低现金)。`)}</p><div class="info">${t('First consider collecting overdue receivables or agreeing supplier terms. Financing adds a future obligation.','先考虑催收逾期款项或协商供应商付款条件。融资会增加未来付款义务。')}</div>${btn(t('Review cash assumptions','核查现金假设'),'nav','', 'data-page="cash"')}</section><section class="card"><h2>${t('Test your financing terms','测试融资条款')}</h2><div class="controls" style="margin-top:15px">${loanField('principal',t('Principal (CNY)','本金（人民币）'),loanInput.principal/100,1,1000000,100)}${loanField('apr',t('Annual nominal rate (%)','名义年利率（%）'),loanInput.apr,0,100,.1)}${loanField('months',t('Term (months)','期限（月）'),loanInput.months,1,60,1)}${loanField('fee',t('Upfront fee (%)','前期手续费（%）'),loanInput.fee,0,20,.1)}</div><p class="small muted" style="margin-top:14px">${t('Reducing-balance amortization; interest rounded to fen each month. Fee deducted from proceeds. First installment on forecast day 30.','采用余额递减的等额还款；每月利息四舍五入到分。手续费从到账金额扣除。首期还款在预测第30天。')}</p></section></div><div class="three"><section class="card"><span class="small muted">${t('Monthly installment','每月还款')}</span><div class="metric">${money(l.payment,2)}</div><p class="small muted">${t('Final installment adjusted for rounding','末期还款按四舍五入结果调整')}</p></section><section class="card"><span class="small muted">${t('Total installments + fee','还款合计 + 手续费')}</span><div class="metric">${money(l.total+l.fee,2)}</div><p class="small muted">${t(`Financing cost: ${money(l.cost,2)}`,`融资成本：${money(l.cost,2)}`)}</p></section><section class="card"><span class="small muted">${t('Net funds received','净到账资金')}</span><div class="metric">${money(l.net,2)}</div><p class="small muted">${t(`Upfront fee: ${money(l.fee,2)}`,`前期手续费：${money(l.fee,2)}`)}</p></section></div><section class="card"><div class="cardhead"><div><h2>${t('Does borrowing solve the timing problem?','借款能否解决时间错配？')}</h2><p>${t('Scenario assumptions retained · not an application or transaction','保留情景假设 · 非贷款申请或交易')}</p></div>${btn(t('Preview analysis','预览分析'),'financepreview','primary')}</div><div class="legend"><span><i class="dot"></i>${t('With illustrative financing','加入示例融资')}</span><span><i class="dot navy"></i>${t('Without financing','不融资')}</span></div>${chart([{name:t('With financing','融资后'),points:withLoan.points,color:'#138c7c'},{name:t('Without financing','融资前'),points:f.points,color:'#8294aa'}],225)}<div class="chartfoot"><div>${t('Lowest cash, without financing','不融资最低现金')}<strong>${money(f.min.cash)}</strong></div><div>${t('Lowest cash, with financing','融资后最低现金')}<strong>${money(withLoan.min.cash)}</strong></div><div>${t('Remaining reserve gap','剩余储备缺口')}<strong>${money(withLoan.need)}</strong></div></div></section><div class="two"><section class="card"><h2>${t('Readiness checklist','融资准备清单')}</h2><p class="small muted" style="margin:8px 0">${t('Self-assessment only. Requirements vary by lender. No documents are uploaded.','仅供自评。机构要求可能不同。不上传文件。')}</p>${['Business registration','Recent bank statements','Receivables aging report','Tax records','Repayment plan'].map((en,i)=>`<label class="checkbox"><input type="checkbox" data-checklist="${i}" ${data.checklist?.includes(i)?'checked':''}>${t(en,['营业执照','近期银行流水','应收账龄报告','纳税记录','还款计划'][i])}</label>`).join('')}</section><section class="card"><h2>${t('Compare alternatives','比较替代方案')}</h2><ul class="list"><li>${t(`Collections: ${money(summary(data).overdue)} overdue. No interest, but customer payment timing is uncertain.`,`催收：${money(summary(data).overdue)}已逾期。无利息，但客户回款时间不确定。`)}</li><li>${t('Supplier deferral: moves cash outflows later. Requires explicit agreement and may affect terms.','供应商延期：推迟支出。需要明确同意，可能影响付款条件。')}</li><li>${t(`Illustrative borrowing: cost ${money(l.cost,2)} across ${loanInput.months} months. Future installments can create new pressure.`,`示例借款：${loanInput.months}个月成本${money(l.cost,2)}。未来还款可能产生新压力。`)}</li></ul></section></div>`;}
function loanField(id,title,value,min,max,step){return `<div class="field"><label for="loan-${id}">${title}</label><input id="loan-${id}" data-loan="${id}" type="number" min="${min}" max="${max}" step="${step}" value="${value}"></div>`;}

function reportsPage(){const s=stats(),p=compare(),f=forecast(data);return `${pageHead('reports',t('A transparent record of how the numbers were calculated.','透明呈现每项数字的计算依据。'),btn(icon('down')+t('Export report','导出报告'),'report'))}<div class="filters">${periodControl()}</div><section class="card"><h2>${t('Cash-basis management report','现金制管理报告')}</h2><p class="small muted" style="margin:8px 0">${esc(businessName())} · ${date(s.start)} — ${date(s.end)}</p><table><thead><tr><th>${t('Metric','指标')}</th><th class="money">${t('Selected period','选定期间')}</th><th class="money">${label('previous')}</th></tr></thead><tbody>${[['revenue',s.revenue,p.revenue],['expenses',s.expenses,p.expenses],['profit',s.profit,p.profit]].map(([k,a,b])=>`<tr><td>${label(k)}</td><td class="money">${money(a,2)}</td><td class="money">${money(b,2)}</td></tr>`).join('')}</tbody></table><div class="info">${t('Net cash result is not accrual profit. Unpaid invoices are not booked as revenue or expenses here. Tax is included in cash movements, with no separate tax liability model.','净现金收益不是权责发生制利润。未结发票不在此计入收入或支出。税费包含在现金流动中，不单独建立税务负债模型。')}</div></section><div class="two"><section class="card"><h2>${t('Ledger reconciliation','账本核对')}</h2><table><tbody>${[[t('Opening balance','期初余额'),data.opening],[t('Posted receipts','已记录收入'),sum(data.transactions.filter(x=>!x.voidedAt&&x.type==='income'))],[t('Posted payments','已记录支出'),-sum(data.transactions.filter(x=>!x.voidedAt&&x.type==='expense'))],[t('Closing cash','期末现金'),s.cash]].map(([n,a])=>`<tr><td>${n}</td><td class="money">${money(a,2)}</td></tr>`).join('')}</tbody></table><p class="small muted" style="margin-top:12px">${t(`Opening ledger date: ${data.openingDate}. Transfers excluded from consolidated cash.`,`期初账本日期：${data.openingDate}。内部转账不计入合并现金。`)}</p></section><section class="card"><h2>${t('Receivables aging','应收账龄')}</h2>${[[t('Not overdue','未逾期'),i=>i.due>=AS_OF],[t('1–30 days overdue','逾期1–30天'),i=>daysBetween(i.due,AS_OF)>0&&daysBetween(i.due,AS_OF)<=30],[t('31–60 days overdue','逾期31–60天'),i=>daysBetween(i.due,AS_OF)>30&&daysBetween(i.due,AS_OF)<=60],[t('Over 60 days','逾期超过60天'),i=>daysBetween(i.due,AS_OF)>60]].map(([n,pred])=>`<div class="barlabel" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${n}</span><strong>${money(sum(data.invoices.filter(i=>i.kind==='receivable'&&pred(i)).map(i=>({amount:outstanding(i)}))))}</strong></div>`).join('')}</section></div><section class="card"><h2>${t('Model boundaries','模型边界')}</h2><ul class="list"><li>${t('Runway is not estimated when historical net cash flow is positive. Future scheduled obligations can still create a cash deficit.','历史净现金流为正时不估算现金可支撑天数。未来付款义务仍可能导致现金短缺。')}</li><li>${t('No cost-of-goods-sold classification, so gross profit is unavailable. No refund, tax filing or currency conversion engine.','没有销售成本分类，因此无法计算毛利。不包含退款、纳税申报或汇率转换引擎。')}</li><li>${t('Payment-delay statistics require completed invoice payment histories; the initial sample is insufficient.','回款延迟统计需要完整发票结算历史；初始样本不足。')}</li><li>${t('This demo stores records in this browser. Private hosting protects access to the site; it is not a multi-user accounting system.','演示将记录存储在当前浏览器。私有托管保护站点访问，但并非多用户会计系统。')}</li></ul></section>`;}

eString(lang==='zh'?'zh-CN':'en-US'))}</span></div>`).join('')||`<p class="small muted">${t('No changes yet.','尚无变更。')}</p>`}</section></div>`;}
function auditLabel(k){return t({invoice_created:'Invoice created',invoice_updated:'Invoice updated',payment_recorded:'Payment recorded in demo',review:'Alert review changed',import:'Transactions imported',quick_entry:'Money entry saved',quick_undo:'Money entry reversed',settings:'Settings changed',draft:'Draft saved locally',financing:'Financing analysis saved'}[k]||k,{invoice_created:'发票已创建',invoice_updated:'发票已更新',payment_recorded:'演示已记录付款',review:'提醒核查状态已变更',import:'交易记录已导入',quick_entry:'收支记录已保存',quick_undo:'收支记录已撤销',settings:'设置已更改',draft:'草稿已本地保存',financing:'融资分析已保存'}[k]||k);}

function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';if(!labels[page])page='overview';const activeRisks=risks(data).filter(r=>!data.reviewed.includes(r.id)).length;const pages={options:optionsPage,transactions:transactionsPage,overview:dashboard,cash:cashPage,invoices:invoicesPage,expenses:expensesPage,financing:financingPage,risk:riskPage,reports:reportsPage,settings:settingsPage,copilot:()=>`${pageHead('copilot',t('Ask, inspect, evaluate. Every answer starts with your records.','提问、核查、评估。每个回答均从企业记录出发。'))}<section class="card"><h2>${t('Choose a decision to explore','选择要探索的决策')}</h2><div class="chips" style="margin-top:20px">${questions().map((q,i)=>`<button data-action="question" data-index="${i}">${q} →</button>`).join('')}</div><div class="info">${t('The persistent copilot uses the selected business only. Questions and local history are separated for each demo business. Supported topics: cash, receivables, expenses, financing and hiring.','常驻助手仅使用当前企业的数据。每个演示企业的问题与本地历史独立存储。支持现金、应收款、支出、融资与招聘话题。')}</div>${btn(t('Open conversation','打开对话'),'opencopilot','primary')} ${btn(t('Clear conversation','清空对话'),'clearchat')}</section>`};const p=profile();$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M4 22L14 6h12L16 22H4z" fill="#66cdb8"/><path d="M9 27L19 11h9L18 27H9z" fill="#c6efe4" fill-opacity=".8"/></svg>Finora <span>融财</span></div><div class="navlabel">${t('WORKSPACE','工作区')}</div><nav class="nav">${['overview','transactions','cash','invoices','expenses','options','financing','risk','reports','copilot'].map(k=>`<button data-action="nav" data-page="${k}" class="${page===k?'active':''}">${icon(k)}${label(k)}${k==='risk'&&activeRisks?`<span class="count">${activeRisks}</span>`:''}</button>`).join('')}</nav><div class="sidebarbottom"><div class="sidecard">${icon('shield')}<strong style="display:block;margin:7px 0;font-size:12px">${t('Your decisions. Your control.','您的决策，您来掌控。')}</strong><p style="font-size:10px;color:#97adbe">${t('AI explains. You approve. Every action leaves a trace.','AI负责解释，您负责确认。每项行动都有记录。')}</p></div><nav class="nav"><button data-action="nav" data-page="settings" class="${page==='settings'?'active':''}">${icon('settings')}${t('Settings & data','设置与数据')}</button></nav><div class="profile"><div class="avatar">LW</div><div><strong style="font-size:11px;color:white">${t('Li Wei','李伟')}</strong><p style="font-size:10px;color:#94aabd">${t('Demo owner','演示企业主')}</p></div></div></div></aside><div class="workspace"><header class="topbar"><button class="iconbtn mobilemenu" data-action="menu" aria-label="${t('Open navigation','打开导航')}">${icon('menu')}</button><select class="business" id="business" aria-label="${t('Select demo business','选择演示企业')}">${profiles.map(p=>`<option value="${p.id}" ${p.id===org?'selected':''}>${esc(p.id===org?businessName():p[lang==='zh'?'zh':'en'])}</option>`).join('')}</select><div class="topright">${badge(t('Synthetic demo','模拟演示'),'gray')}<div class="lang"><button data-action="language" data-lang="en" class="${lang==='en'?'active':''}">EN</button><button data-action="language" data-lang="zh" class="${lang==='zh'?'active':''}">中文</button></div><button class="iconbtn" data-action="nav" data-page="risk" aria-label="${t('Risk notifications','风险通知')}">${icon('bell')}</button><button class="iconbtn mobilecopilot" data-action="opencopilot" aria-label="${t('Open AI copilot','打开AI助手')}">${icon('copilot')}</button></div></header><main class="content">${pages[page]()}<footer class="footer"><span>Finora 融财 · ${t('Smarter cash flow. Stronger businesses.','智慧管现金流，助力企业成长。')}</span><span>${t('Demo snapshot: 13 Oct 2026 · CNY','演示快照：2026年10月13日 · 人民币')}</span></footer></main></div>${copilotPanel()}${mobileNav()}</div>`;if(page==='copilot'&&innerWidth<1000)$('.copilot').classList.add('open');}

function evidence(id){const i=data.invoices.find(i=>i.id===id&&i.org===org);if(i){invoiceDetail(i);return;}const tx=data.transactions.find(x=>x.id===id&&x.org===org);if(tx){modal(t('Source transaction','来源交易'),`<p class="small muted">${t('Synthetic record','模拟记录')}</p><table><tbody>${[[t('Record ID','记录ID'),tx.id],[t('Date','日期'),tx.date],[t('Counterparty','交易方'),tx.party],[t('Category','分类'),catLabel(tx.category)],[t('Amount','金额'),money(tx.amount,2)],[t('Description','说明'),tx.description||'—']].map(([k,v])=>`<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join('')}</tbody></table>`);return;}const r=data.recurring.find(r=>r.id===id);if(r){modal(t('Recurring forecast assumption','定期预测假设'),`<p>${esc(catLabel(r.category))} · ${money(r.amount)}</p><div class="info">${t(`Scheduled on day ${r.day} of every month. Based on the synthetic monthly obligation; this is a forecast assumption, not a posted transaction.`,`安排在每月${r.day}日。根据模拟每月付款义务；这是预测假设，不是已记录交易。`)}</div>`);return;}modal(t('Scenario assumption','情景假设'),`<p>${t('User-entered hiring costs or repayment terms. No external transaction has been executed.','用户输入的招聘成本或还款条款。未执行外部交易。')}</p>`);}

let editing=null;function invoiceForm(i=null){editing=i?.id||null;modal(t(i?'Edit invoice':'New invoice',i?'编辑发票':'新建发票'),`<form id="invoiceform"><div class="controls"><div class="field"><label for="iid">${t('Invoice number','发票编号')}</label><input id="iid" name="id" required maxlength="40" pattern="[A-Za-z0-9_-]+" value="${esc(i?.id||'INV-'+Date.now().toString().slice(-6))}" ${i?'readonly':''}></div><div class="field"><label for="ikind">${t('Type','类型')}</label><select id="ikind" name="kind" ${i?.paid?'disabled':''}><option value="receivable" ${i?.kind==='receivable'?'selected':''}>${t('Money owed to you','别人欠你的钱')}</option><option value="payable" ${i?.kind==='payable'?'selected':''}>${t('Money you owe','你需要支付的钱')}</option></select></div><div class="field"><label for="iparty">${t('Customer / supplier','客户 / 供应商')}</label><input id="iparty" name="party" required maxlength="100" value="${esc(i?.party||'')}"></div><div class="field"><label for="izh">${t('Chinese name (optional)','中文名称（可选）')}</label><input id="izh" name="partyZh" maxlength="100" value="${esc(i?.partyZh||'')}"></div><div class="field"><label for="issued">${t('Issue date','开具日期')}</label><input id="issued" name="issued" type="date" required max="${AS_OF}" value="${i?.issued||AS_OF}"></div><div class="field"><label for="due">${t('Due date','到期日')}</label><input id="due" name="due" type="date" required value="${i?.due||addDays(AS_OF,30)}"></div><div class="field"><label for="expected">${t('Expected settlement date','预计结算日期')}</label><input id="expected" name="expected" type="date" required value="${i?.expected||addDays(AS_OF,30)}"></div><div class="field"><label for="subtotal">${t('Subtotal (CNY)','税前金额（人民币）')}</label><input id="subtotal" name="subtotal" type="number" required min=".01" max="1000000" step=".01" value="${i?i.subtotal/100:''}"></div><div class="field"><label for="taxRate">${t('Tax rate (%)','税率（%）')}</label><input id="taxRate" name="taxRate" type="number" required min="0" max="100" step=".01" async function ask(question){if(pending||!question.trim())return;pending=true;const requestOrg=org;const previous=data.chats.at(-1),context=previous?analyze(data,previous.question,lang).kind:'';data.chats.push({question:question.trim().slice(0,2000),context,reportPeriod:{start:stats().start,end:stats().end}});data.chats=data.chats.slice(-20);save();render();$('.copilot').classList.add('open');const body=$('.copilotbody');body.scrollTop=body.scrollHeight;

 if(a==='settlement'){const i=data.invoices.find(i=>i.id===id);modal(t('Record a demo settlement','记录演示结算'),`<form id="settlementform" data-id="${esc(id)}"><p class="small muted">${esc(id)} · ${t('Outstanding','未结金额')} ${money(outstanding(i),2)}</p><div class="field" style="margin-top:15px"><label for="settleamount">${t('Amount received / paid (CNY)','已收到 / 已付金额（人民币）')}</label><input id="settleamount" name="amount" type="number" step=".01" min=".01" max="${outstanding(i)/100}" required value="${outstanding(i)/100}"></div><div class="info">${t('This records a synthetic cash movement dated 13 Oct 2026. It does not initiate or confirm a real payment.','此操作记录一笔日期为2026年10月13日的模拟现金流动，不发起或确认真实付款。')}</div><button type="submit" class="btn primary">${t('Preview settlement','预览结算')}</button></form>`,' ');return;}
 if(a==='reminder'){const i=data.invoices.find(i=>i.id===id),text=t(`Hello ${party(i)},\n\nOur records show ${money(outstanding(i),2)} outstanding on invoice ${i.id}, due ${i.due}. Could you confirm your expected payment date? Please let us know if anything needs clarification.\n\nThank you.`,`您好，${party(i)}：\n\n根据我们的记录，发票${i.id}仍有${money(outstanding(i),2)}未结清，到期日为${i.due}。请问预计何时付款？如有疑问，请随时告知。\n\n谢谢。`);confirm(t('Preview reminder draft','预览催款草稿'),`<pre>${esc(text)}</pre><p class="small muted">${t('Save as a local draft only. No email or message will be sent.','仅保存本地草稿。不发送邮件或消息。')}</p>`,()=>{data.drafts=[...(data.drafts||[]),{id,text,date:new Date().toISOString()}];log('draft',id);save();download(id+'-reminder.txt',text);toast(t('Draft saved and downloaded. Nothing sent.','草稿已保存并下载。未发送消息。'));render();});return;}
 if(a==='review'){const r=risks(data).find(r=>r.id===id);confirm(t('Confirm review state','确认核查状态'),`<p>${t(...riskText[id])}</p><div class="info">${t('This changes the review marker only. The underlying record and forecast remain intact.','仅更改核查标记。原始记录与预测仍保留。')}</div>`,()=>{data.reviewed=data.reviewed.includes(id)?data.reviewed.filter(x=>x!==id):[...data.reviewed,id];log('review',id);save();render();toast(t('Review state updated.','核查状态已更新。'));});return;}

document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;if(form.id==='chatform'){const q=$('#chatinput').value;ask(q);return;}
 if(form.id==='invoiceform'){const v=Object.fromEntries(new FormData(form)),existing=data.invoices.find(i=>i.id===editing),subtotal=Math.round(+v.subtotal*100),taxRate=+v.taxRate,total=subtotal+Math.round(subtotal*taxRate/100);const i={id:v.id.trim(),org,kind:existing?.paid?existing.kind:v.kind,party:v.party.trim(),partyZh:v.partyZh.trim(),issued:v.issued,due:v.due,expected:v.expected,subtotal,taxRate,total,paid:existing?.paid||0};try{if(!i.party||i.issued>AS_OF||(!editing&&data.invoices.some(x=>x.id===i.id)))throw Error('invoice');validateData({...data,invoices:[...data.invoices.filter(x=>x.id!==editing),i]});}catch{$('#formerror').innerHTML=`<div class="error">${t('Check dates, unique invoice number and amounts. Total cannot be less than recorded payments.','请检查日期、唯一发票编号与金额。总额不能低于已记录结算金额。')}</div>`;return;}const wasEditing=editing;confirm(t('Confirm invoice changes','确认发票变更'),`<p>${esc(i.id)} · ${esc(party(i))}</p><div class="metric">${money(i.total,2)}</div><p class="small muted">${t('This changes outstanding balances and expected cash timing. No cash movement is recorded until a settlement is entered.','这会改变未结金额与预计现金时间。在录入结算前，不会记录现金流动。')}</p>`,()=>{data.invoices=[...data.invoices.filter(x=>x.id!==wasEditing),i];log(wasEditing?'invoice_updated':'invoice_created',i.id);save();render();toast(t('Invoice saved.','发票已保存。'));});return;}

window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(p!==page){page=p;render();}});

if(location.protocol!=='file:'&&!globalThis.FINORA_OFFLINE)fetch('/api/status').then(r=>r.ok?r.json():null).then(s=>{if(s?.mode==='configured'){providerMode='configured';if(!pending)render();}}).catch(()=>{});

function updateScenario(){if(page!=='cash')return;const base=forecast(data,{days:scenario.days}),f=forecast(data,scenario);$('#scenario-chart').innerHTML=chart([{name:t('Scenario','情景'),points:f.points,color:'#138c7c'},{name:t('Base','基准'),points:base.points,color:'#8294aa'}],235);$('#scenario-kpis').innerHTML=kpi('cashBalance',summary(data).cash,t('Reconciled ledger','已核对账本'),'cash',true)+kpi('minimum',f.min.cash,date(f.min.date),'cash')+kpi('shortfall',f.shortfall,t('Below zero, before reserve','低于零的部分，不含储备'),'financing')+kpi('need',f.need,t('Includes minimum reserve','包含最低储备'),'financing');$('#scenario-impact').innerHTML='<strong>'+t('Impact on the lowest balance:','最低余额变化：')+' '+money(f.min.cash-base.min.cash)+'</strong><p class="small muted">'+(f.first?t('First cash deficit: '+date(f.first.date)+'.','首次现金赤字：'+date(f.first.date)+'。'):t('No negative daily balance in this scenario.','该情景没有出现负的日末余额。'))+'</p>'; }

const previousKpi=kpi;
kpi=function(name,value,foot,action,dark=false){return `<article class="kpi ${dark?'dark':''}"><button class="kpilink" data-action="nav" data-page="${action}"><span class="label">${label(name)}${icon(action)}</span><strong>${money(value)}</strong><span class="foot">${foot}</span></button><button class="metrichelp" data-action="meaning" data-metric="${name}">${t('What does this mean?','这是什么意思？')}</button></article>`;};
const previousDashboard=dashboard;
dashboard=function(){
 const today=summary(data,AS_OF,AS_OF),f=forecast(data),undo=data.transactions.find(x=>x.id===data.lastQuickEntry&&!x.voidedAt);
 let old=previousDashboard().replace(t('A clear view. A smarter next move.','看清财务，迈出明智下一步。'),t("Today's financial status",'今日财务状况')).replace(t('Your next best actions','优先行动'),t('What should I do next?','接下来该做什么？'));
 const position=old.indexOf('<div class="filters">');
 const statusBlock=`<section class="ownerstatus ${f.first?'pressure':''}"><div class="cardhead"><div><h2>${f.first?t('Cash is available now, but a bill needs a plan.','目前有现金，但有一笔账单需要安排。'):t('Your base forecast has no cash deficit.','基准预测没有现金赤字。')}</h2><p class="muted small" style="margin-top:6px">${t(`Synthetic snapshot · ${AS_OF} · not today's live bank balance`,`模拟快照 · ${AS_OF} · 非今日实时银行余额`)}</p></div>${badge(f.first?t('Needs attention','需要关注'):t('Base case stable','基准情况稳定'),f.first?'amber':'')}</div><p>${f.first?t(`${money(today.cash)} available. A deficit of ${money(f.shortfall)} is projected by ${date(f.first.date)}. Compare collection and payment timing before borrowing.`,`目前可用${money(today.cash)}。预计${date(f.first.date)}出现${money(f.shortfall)}缺口。借款前请比较回款与付款时间。`):t(`You have ${money(today.cash)} available. Check late customer payments and your ${money(f.reserve)} emergency buffer before new spending.`,`目前可用${money(today.cash)}。新增支出前，请核查逾期客户回款与${money(f.reserve)}应急备用金。`)}</p><div class="todaygrid"><div><span>${t('Money received on snapshot date','快照当日收到的钱')}</span><strong>${money(today.revenue)}</strong></div><div><span>${t('Money spent on snapshot date','快照当日支出的钱')}</span><strong>${money(today.expenses)}</strong></div><div><span>${label('ar')}</span><strong>${money(today.ar)}</strong></div><div><span>${label('ap')}</span><strong>${money(today.ap)}</strong></div></div>${!today.transactions.length?`<p class="small muted">${t('No money entries on this reporting date.','此报告日期没有收支记录。')}</p>`:''}<div class="quickactions">${btn('+ '+t('Money received','记录收款'),'quickincome','primary')}${btn('− '+t('Money spent','记录支出'),'quickexpense')}${btn(t('What should I do next?','接下来该做什么？'),'nextactions')}${btn(t('Compare your options','比较解决方案')+' →','nav','', 'data-page="options"')}</div></section>${undo?`<div class="undoentry"><span>${t('Last quick entry saved','最近快捷记录已保存')}: ${money(undo.amount,2)} · ${esc(undo.party)}</span>${btn(t('Undo','撤销'),'quickundo','',`data-id="${esc(undo.id)}"`)}</div>`:''}`;
 old=old.slice(0,position)+statusBlock+`<section class="card"><div class="cardhead"><h2>${t('What should I do next?','接下来该做什么？')}</h2>${btn(t('Compare options','比较方案'),'nav','', 'data-page="options"')}</div>${riskRows()}</section><details class="financialdetail"><summary>${t('View period report, charts and invoice summary','查看期间报告、图表与发票汇总')}</summary>`+old.slice(position)+'</details>';
 return old;
};
function meaning(key){
 const descriptions={cashBalance:[['Money available now is the opening ledger plus recorded receipts minus recorded payments.','现在可用的钱等于期初账本加已记录收款减已记录支出。'],['Example: ¥1,000 + ¥500 − ¥200 = ¥1,300.','例如：¥1,000 + ¥500 − ¥200 = ¥1,300。'],['This is recorded cash, not a verified bank balance.','这是已记录现金，不是经银行核实的余额。']],revenue:[['Money received is the cash recorded as coming in during the selected period.','收到的钱是选定期间已记录的流入现金。'],['An unpaid ¥1,000 invoice is not a receipt until you record its payment.','未结清的¥1,000发票在记录收款前不计入收款。'],['Cash receipts are not necessarily accrual accounting revenue.','现金收款不一定等于权责发生制收入。']],expenses:[['Money spent is cash recorded as going out during the selected period.','支出的钱是选定期间已记录的流出现金。'],['Rent and inventory purchases reduce cash when recorded.','记录租金与采购付款后，现金减少。'],['Inventory purchases are cash spending, not necessarily the cost of goods sold.','库存采购是现金支出，不一定等于销售成本。']],profit:[['Subtract period money spent from money received.','用本期间收款减去支出。'],['¥5,000 received − ¥6,000 spent = −¥1,000.','收到¥5,000减支出¥6,000等于−¥1,000。'],['This cash result is not net profit or the money remaining in your bank.','此现金结果不是净利润，也不是银行剩余余额。']],ar:[['Customers still owe you this amount on recorded invoices.','根据已记录发票，客户仍欠您此金额。'],['A ¥1,000 invoice with ¥300 paid leaves ¥700 owed.','¥1,000发票已付¥300，还欠¥700。'],['Money owed is not money already available.','别人欠您的钱不等于现在可用的钱。']],ap:[['This is the outstanding amount you owe suppliers.','这是您尚未付给供应商的金额。'],['A ¥2,000 bill with ¥500 paid leaves ¥1,500 to pay.','¥2,000账单已付¥500，还需付¥1,500。'],['Check due dates to know when cash is needed.','请核查到期日，了解何时需要现金。']],minimum:[['The smallest projected daily balance in this scenario.','此情景中最低的预计日末余额。'],['Month-end cash can be positive even if a mid-month bill causes a deficit.','月末现金为正，月中的账单仍可能导致赤字。'],['Forecasts depend on assumptions and are not guaranteed.','预测依赖假设，不保证发生。']],shortfall:[['How far the lowest forecast cash falls below zero.','最低预测现金低于零的部分。'],['A lowest balance of −¥1,000 means a ¥1,000 deficit.','最低余额−¥1,000代表¥1,000赤字。'],['This does not include your emergency buffer.','这不包含应急备用金。']],need:[['Extra cash needed to preserve your emergency buffer at the lowest point.','在最低点保留应急备用金所需的额外现金。'],['A −¥1,000 low point and ¥2,000 buffer imply ¥3,000 needed.','最低−¥1,000与¥2,000备用金意味着需要¥3,000。'],['This is a scenario gap, not a recommended or approved loan amount.','这是情景缺口，不是推荐或获批贷款金额。']]};
 const info=descriptions[key]||descriptions.minimum;modal(label(key),`<p>${t(...info[0])}</p><div class="info">${t(...info[1])}</div><p class="small muted">${t(...info[2])}</p>`);
}
function quickForm(type){
 const rows=data.invoices.filter(i=>i.kind===(type==='income'?'receivable':'payable')&&outstanding(i));
 modal(type==='income'?t('Record money received','记录收款'):t('Record money spent','记录支出'),`<form id="quickform" class="quickform" data-type="${type}"><p class="entrynote">${t(`Add a synthetic record to ${businessName()}. No money is sent or verified.`,`向${businessName()}添加模拟记录。不发送或核实真实资金。`)}</p><div class="controls"><div class="field"><label for="quickamount">${t('Amount (CNY)','金额（人民币）')}</label><input id="quickamount" name="amount" required type="number" inputmode="decimal" step=".01" min=".01" max="1000000" placeholder="0.00"></div><div class="field"><label for="quickparty">${type==='income'?t('Customer or source','客户或来源'):t('Supplier or recipient','供应商或收款方')}</label><input id="quickparty" name="party" required maxlength="100" placeholder="${t('Who was it from / for?','来自谁 / 支付给谁？')}"></div><div class="field"><label for="quickdate">${t('Record date','记录日期')}</label><input id="quickdate" name="date" type="date" required min="${addDays(data.openingDate,1)}" max="${AS_OF}" value="${AS_OF}"></div><div class="field"><label for="quickcategory">${t('Category','分类')}</label><select id="quickcategory" name="category">${(type==='income'?['sales','other']:['other','operations','rent','payroll','inventory','marketing']).map(c=>`<option value="${c}">${catLabel(c)}</option>`).join('')}</select></div></div><details><summary>${t('More details (optional)','更多信息（可选）')}</summary><div class="controls"><div class="field"><label for="quickinvoice">${t('Link an invoice / bill','关联发票 / 账单')}</label><select name="invoiceId" id="quickinvoice"><option value="">${t('No linked invoice','不关联发票')}</option>${rows.map(i=>`<option value="${esc(i.id)}">${esc(i.id)} · ${esc(party(i))} · ${money(outstanding(i),2)}</option>`).join('')}</select></div><div class="field"><label for="quickmethod">${t('Payment method (record only)','付款方式（仅记录）')}</label><select id="quickmethod" name="method">${[['unspecified',t('Not specified','未指定')],['cash',t('Cash','现金')],['bank',t('Bank transfer','银行转账')],['other',t('Other','其他')]].map(([v,n])=>`<option value="${v}">${n}</option>`).join('')}</select></div></div><div class="field" style="margin-top:12px"><label for="quicknote">${t('Note','备注')}</label><textarea name="note" id="quicknote" maxlength="300" rows="2"></textarea></div></details><div id="quickerror"></div><p class="small muted">${t('The reporting date stays fixed at 13 Oct 2026. Linking a record reduces that invoice’s outstanding balance exactly once.','报告日期固定为2026年10月13日。关联记录仅按一次结算减少未结金额。')}</p><footer>${btn(t('Cancel','取消'),'closemodal','', 'type="button"')}<button type="submit" class="btn primary">${t('Review and save','核对并保存')}</button></footer></form>`,' ');
}
function commitQuick(next){
 try{validateData(next);localStorage.setItem('finora-'+org,JSON.stringify(next));data=next;render();return true;}catch{toast(t('Could not save. No balances changed. Free browser storage or export a backup.','无法保存，余额未更改。请清理浏览器存储或导出备份。'));return false;}
}
function transactionsPage(){const rows=data.transactions.filter(x=>x.createdVia==='quick').slice().reverse();return `${pageHead('transactions',t('Add a record. Check it. Reverse mistakes safely.','添加记录、核查信息、安全撤销错误。'))}<div class="quickactions">${btn('+ '+t('Money received','记录收款'),'quickincome','primary')}${btn('− '+t('Money spent','记录支出'),'quickexpense')}</div><section class="card"><h2>${t('Quick-entry history','快捷收支记录')}</h2><p class="small muted" style="margin:8px 0">${t('Entries are synthetic and stored in this browser. Undo preserves the original record and audit history.','记录为模拟数据，存储于当前浏览器。撤销保留原始记录与审计历史。')}</p>${rows.length?`<div class="tablewrap"><table><thead><tr><th>${t('Date / person','日期 / 交易方')}</th><th>${t('Type','类型')}</th><th class="money">${t('Amount','金额')}</th><th>${t('Action','操作')}</th></tr></thead><tbody>${rows.map(x=>`<tr class="${x.voidedAt?'reversed':''}"><td>${date(x.date)}<br>${esc(x.party)}<br><button class="textbtn" data-action="evidence" data-id="${esc(x.id)}">${esc(x.id)}</button></td><td>${x.voidedAt?badge(t('Reversed','已撤销'),'gray'):badge(x.type==='income'?t('Money received','收款'):t('Money spent','支出'),x.type==='income'?'':'amber')}</td><td class="money">${money(x.amount,2)}</td><td>${x.voidedAt?'—':btn(t('Undo','撤销'),'quickundo','',`data-id="${esc(x.id)}"`)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><h3>${t('No quick entries yet','尚无快捷记录')}</h3><p>${t('Use the buttons above. Existing imported and invoice records are preserved in their workspaces.','请使用上方按钮。现有导入与发票记录仍保留在各自工作区。')}</p></div>`}</section>`;}
let comparisonInput={invoiceId:'INV-1042',percent:100,collectionDays:1,collectionCost:0,billId:'BILL-0201',deferralDays:14};
function optionsPage(){const invoiceRows=data.invoices.filter(i=>i.kind==='receivable'&&outstanding(i)),billRows=data.invoices.filter(i=>i.kind==='payable'&&outstanding(i));if(!invoiceRows.some(i=>i.id===comparisonInput.invoiceId))comparisonInput.invoiceId=invoiceRows[0]?.id||'';if(!billRows.some(i=>i.id===comparisonInput.billId))comparisonInput.billId=billRows[0]?.id||'';
 const c=compareActions(data,{...comparisonInput,loanTerms:loanInput},scenario),input=(key,title,value,min,max,step=1)=>`<div class="field"><label for="compare-${key}">${title}</label><input id="compare-${key}" data-compare="${key}" type="number" min="${min}" max="${max}" step="${step}" value="${value}"></div>`;
 return `${pageHead('options',t('Compare timing, cost and uncertainty before acting.','行动前，比较时间、成本与不确定性。'))}<div class="info">${t('Simulated — not executed. All options start from the same cash and existing cash-flow assumptions. Collections move money from its original expected date; they do not count an invoice twice.','模拟 — 未执行。所有方案使用相同起始现金与现有现金流假设。催收仅移动原预计日期的回款，不会重复计算发票。')}</div><section class="card"><div class="cardhead"><h2>${t('Baseline: keep current assumptions','基准：保留当前假设')}</h2>${btn(t('Review assumptions','核查假设'),'nav','', 'data-page="cash"')}</div>${optionFacts(c.base,c.base)}<p class="small muted">${t('The reporting date is 13 Oct 2026. Figures at 7, 30 and 90 days are scenario estimates.','报告日期为2026年10月13日。7、30与90天数值均为情景估计。')}</p></section><div class="options-grid"><section class="optioncard"><h2>1. ${t('Collect customer payments','收回客户欠款')}</h2><div class="field"><label for="compare-invoiceId">${t('Select an outstanding invoice','选择未结发票')}</label><select id="compare-invoiceId" data-compare="invoiceId">${invoiceRows.length?invoiceRows.map(i=>`<option value="${esc(i.id)}" ${i.id===comparisonInput.invoiceId?'selected':''}>${esc(i.id)} · ${money(outstanding(i))}</option>`).join(''):`<option value="">${t('No outstanding invoice','没有未结发票')}</option>`}</select></div>${input('percent',t('Percentage to collect (%)','拟收回比例（%）'),comparisonInput.percent,0,100)}${input('collectionDays',t('Expected receipt in days','预计几天后收到'),comparisonInput.collectionDays,1,90)}${input('collectionCost',t('Collection cost (CNY)','催收成本（人民币）'),comparisonInput.collectionCost/100,0,1000000,.01)}${c.collect?optionFacts(c.collect,c.base):missingOption(t('An outstanding customer invoice is required.','需要未结客户发票。'))}<p class="small muted">${t('Added financing debt: none. Cost:','新增融资债务：无。成本：')} ${money(comparisonInput.collectionCost,2)}</p><p class="optionrisk">${t('Customer agreement and payment are uncertain. This changes the forecast only; it does not mark the invoice paid.','客户同意与回款时间不确定。仅改变预测，不标记发票已结清。')}</p>${btn(t('View selected invoice','查看所选发票'),'evidence','',`data-id="${esc(comparisonInput.invoiceId)}" ${!c.collect?'disabled':''}`)}</section><section class="optioncard"><h2>2. ${t('Renegotiate supplier timing','协商供应商付款时间')}</h2><div class="field"><label for="compare-billId">${t('Select a supplier bill','选择供应商账单')}</label><select id="compare-billId" data-compare="billId">${billRows.length?billRows.map(i=>`<option value="${esc(i.id)}" ${i.id===comparisonInput.billId?'selected':''}>${esc(i.id)} · ${money(outstanding(i))}</option>`).join(''):`<option value="">${t('No unpaid bill','没有未付账单')}</option>`}</select></div>${input('deferralDays',t('Proposed extra days','拟延后天数'),comparisonInput.deferralDays,0,60)}<div class="info">${c.defer?t(`Assumed new date: ${c.defer.events.find(e=>e.id===comparisonInput.billId)?.date||'Beyond horizon'}`,`假设新日期：${c.defer.events.find(e=>e.id===comparisonInput.billId)?.date||'预测期之外'}`):t('No supplier obligation available.','没有可用供应商付款义务。')}</div>${c.defer?optionFacts(c.defer,c.base):missingOption(t('An unpaid supplier bill is required.','需要未付供应商账单。'))}<p class="small muted">${t('Late fees are unknown and excluded, not assumed to be free.','滞纳金未知，未计入；不代表没有费用。')}</p><p class="optionrisk">${t('Requires supplier agreement. Delay may cause fees, breach terms or harm the relationship. The actual bill date stays unchanged.','需要供应商同意。延期可能产生费用、违反条款或影响关系。实际账单日期不变。')}</p>${btn(t('Review supplier bill','核查供应商账单'),'evidence','',`data-id="${esc(comparisonInput.billId)}" ${!c.defer?'disabled':''}`)}</section><section class="optioncard"><h2>3. ${t('Test a business loan','测试企业借款')}</h2>${badge(t('Hypothetical terms','假设条款'),'amber')}<div class="controls" style="margin-top:12px">${loanField('principal',t('Principal (CNY)','本金（人民币）'),loanInput.principal/100,1,1000000,100)}${loanField('apr',t('Annual rate (%)','年利率（%）'),loanInput.apr,0,100,.1)}${loanField('months',t('Months','月数'),loanInput.months,1,60,1)}${loanField('fee',t('Upfront fee (%)','前期费用（%）'),loanInput.fee,0,20,.1)}</div>${optionFacts(c.borrow,c.base)}<div class="optionfacts"><div><span>${t('Monthly installment','每月还款')}</span><strong>${money(c.loan.payment,2)}</strong></div><div><span>${t('Full-term cost incl. fee','全期限成本含手续费')}</span><strong>${money(c.loan.cost,2)}</strong></div><div><span>${t('Total installments + fee','还款合计加费用')}</span><strong>${money(c.loan.total+c.loan.fee,2)}</strong></div><div><span>${t('Debt remaining at day 90','第90天剩余本金')}</span><strong>${money(c.loan.schedule[Math.min(3,loanInput.months)-1].balance,2)}</strong></div></div><p class="optionrisk">${t('Proceeds tomorrow, after fees; first repayment on day 30. No lender offer or approval. Debt remains an obligation after the chart ends.','假设明日到账并扣费，第30天首次还款。非机构报价或批准。图表结束后仍可能有债务义务。')}</p>${btn(t('Detailed loan analysis','详细借款分析'),'nav','', 'data-page="financing"')}</section></div><section class="card" style="margin-top:18px"><h2>${t('Combine the three assumptions','组合三项假设')}</h2>${optionFacts(c.combined,c.base)}<p class="optionrisk">${t('Combining options does not guarantee agreement or payment. Compare the cash benefit against collection costs, unknown late fees and debt repayment. No option is universally best.','组合方案不保证达成协议或回款。请将现金改善与催收成本、未知滞纳金、债务还款比较。没有适合所有企业的最佳方案。')}</p></section>`;
}
function missingOption(text){return `<div class="empty"><p>${text}</p></div>`;}
function optionFacts(f,base){return `<div class="optionfacts">${[[t('Change in cash tomorrow','明日现金变化'),f.changeTomorrow],[t('Cash after 7 days','7天后现金'),f.cash7],[t('Cash after 30 days','30天后现金'),f.cash30],[t('Cash after 90 days','90天后现金'),f.cash90],[t('Lowest projected cash','最低预计现金'),f.min.cash],[t('Change in lowest cash vs. base','最低现金较基准变化'),f.min.cash-base.min.cash]].map(([n,a])=>`<div><span>${n}</span><strong>${money(a,2)}</strong></div>`).join('')}<div><span>${t('First cash deficit','首次现金赤字')}</span><strong>${f.firstDate?date(f.firstDate):t('None projected','未预计出现')}</strong></div></div>`;}
function mobileNav(){return `<nav class="bottomnav" aria-label="${t('Mobile navigation','移动导航')}">${[['overview',t('Home','首页'),'overview'],['transactions',t('Entries','收支'),'invoices'],['cash',t('Cash','现金'),'cash'],['copilot',t('Assistant','助手'),'copilot']].map(([p,n,i])=>`<button data-action="nav" data-page="${p}" class="${page===p?'active':''}">${icon(i)}${n}</button>`).join('')}<button data-action="more">${icon('menu')}${t('More','更多')}</button></nav>`;}
const previousAnswerHTML=answerHTML;
answerHTML=function(a){const reason=a.figures.length?a.figures.slice(0,3).map(([k,v])=>`${label(k)}: ${money(v,2)}`).join(' · '):t('The information needed is not yet available.','所需信息尚不可用。');const next={cash:t('Review the next large bill and compare collection timing.','核查下一笔大额账单并比较回款时间。'),invoices:t('Open the overdue invoice and prepare a reminder draft.','打开逾期发票并准备提醒草稿。'),expenses:t('Check source records before treating the expense as a duplicate.','判断重复支出前先核对原始记录。'),scenario:t('Open the scenario workspace and test your assumptions.','打开情景工作区并测试假设。'),financing:t('Compare collections and supplier timing with borrowing costs.','比较回款、供应商付款时间与借款成本。'),options:t('Choose an invoice, supplier bill and financing terms in the comparison.','在比较页面选择发票、账单与融资条款。'),hiring:t('Enter total additional monthly payroll, including employer costs.','输入包含雇主成本的每月新增薪酬。'),clarify:t('Tell me the decision and period you want to evaluate.','请告诉我需要评估的决策与期间。'),comparison:t('Choose complete comparable reporting periods.','请选择完整且可比的报告期间。')};
 return `<div class="answer"><div class="answertop">${icon('copilot')}<strong>${a.live?t('Live explanation · engine figures','实时解释 · 引擎数值'):t('Simulated assistant · calculated results','模拟助手 · 已计算结果')}</strong></div><div class="answer-short"><div><h3>${t('Problem','问题')}</h3><p>${esc(a.summary)}</p></div><div><h3>${t('Reason','原因')}</h3><p>${esc(reason)}</p></div><div><h3>${t('Next step','下一步')}</h3><p>${next[a.kind]||next.cash}</p></div></div><details class="evidence-details"><summary>${t('View evidence & calculations','查看证据与计算')}</summary><div class="numbers">${a.figures.map(([k,v])=>`<div><span>${label(k)}</span><strong>${money(v,2)}</strong></div>`).join('')}</div><div class="evidence">${a.evidence.map(id=>`<button data-action="evidence" data-id="${esc(id)}">${esc(id)}</button>`).join('')}</div><details><summary>${t('Calculation & assumptions','计算与假设')}</summary>${a.assumptions.map(x=>`<p>${esc(x)}</p>`).join('')}</details><p>${esc(a.uncertainty)}</p>${a.aiExplanation?`<p>${esc(a.aiExplanation)}</p>`:''}</details><p class="small muted" style="margin:8px 0">${t('Forecast timing is uncertain. Review evidence before acting.','预测时间具有不确定性。行动前请核查证据。')}</p>${btn(t('Evaluate next action','评估下一步')+' →','nav','',`data-page="${a.action}"`)}</div>`;
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;
 if(el.dataset.action==='meaning')meaning(el.dataset.metric);
 if(el.dataset.action==='quickincome')quickForm('income');
 if(el.dataset.action==='quickexpense')quickForm('expense');
 if(el.dataset.action==='quickundo'){const id=el.dataset.id;confirm(t('Undo this money entry?','撤销此收支记录？'),`<p>${t('The original record is kept with a reversal marker. Any linked invoice settlement and cash effect are reversed together.','原始记录保留并标记撤销。关联发票结算与现金影响一起恢复。')}</p>`,()=>{try{const next=undoQuickEntry(data,id);if(commitQuick(next))toast(t('Entry reversed. Balances restored; history retained.','记录已撤销，余额已恢复，历史保留。'));}catch{toast(t('Undo is unavailable for this entry. Review the record before correcting it.','此记录不可撤销。更正前请核查记录。'));}});}
 if(el.dataset.action==='nextactions'){modal(t('What should I do next?','接下来该做什么？'),`<p class="entrynote">${t('Up to three priorities from the current business records.','根据当前企业记录列出最多三项优先事项。')}</p>${riskRows()}<div class="quickactions">${btn(t('Compare your options','比较解决方案'),'nav','', 'data-page="options"')}${btn(t('Ask assistant','询问助手'),'askcash')}</div>`);}
 if(el.dataset.action==='more'){modal(t('More workspaces','更多工作区'),`<div class="chips">${['invoices','expenses','options','financing','risk','reports','settings'].map(p=>btn(label(p),'nav','',`data-page="${p}"`)).join('')}</div>`);}
 if(el.dataset.action==='nav'&&$('#modalroot').innerHTML)closeModal();
});
document.addEventListener('submit',e=>{if(e.target.id!=='quickform')return;e.preventDefault();const form=e.target,v=Object.fromEntries(new FormData(form));const input={...v,note:v.note||'',type:form.dataset.type,id:`${org}-QUICK-${crypto.randomUUID()}`};let next;try{next=recordQuickEntry(data,input);}catch{$('#quickerror').innerHTML=`<div class="error">${t('Check the amount, date and linked invoice. Amounts must be positive with at most two decimals and cannot exceed the unpaid invoice balance.','请核查金额、日期与关联发票。金额须为正数且最多两位小数，不得超过未结发票余额。')}</div>`;return;}confirm(t('Confirm this money record','确认此收支记录'),`<p>${esc(v.party)} · ${money(moneyInput(v.amount),2)} · ${esc(v.date)}</p><div class="info">${t('Save a synthetic entry locally. No actual money moves. Undo remains available for this quick entry.','本地保存模拟记录。不发生实际资金转移。此快捷记录可撤销。')}</div>`,()=>{if(next.org!==org){toast(t('Business changed; reopen the entry form.','企业已变更；请重新打开录入表单。'));return;}if(commitQuick(next))toast(t('Saved. Use Undo on the dashboard or Money entries.','已保存。可在总览或收支记录页面撤销。'));});});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset.compare)return;const key=el.dataset.compare,old=comparisonInput[key];comparisonInput[key]=['invoiceId','billId'].includes(key)?el.value:key==='collectionCost'?Math.round(+el.value*100):+el.value;try{compareActions(data,{...comparisonInput,loanTerms:loanInput},scenario);render();}catch{comparisonInput[key]=old;toast(t('Enter valid dates, percentages and costs.','请输入有效天数、比例与成本。'));render();}});
render();

</script></body></html>
